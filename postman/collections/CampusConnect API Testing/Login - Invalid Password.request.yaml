$kind: http-request
url: http://localhost:3000/api/v1/sessions
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"student@campusconnect.test\",\r

    \  \"password\": \"WrongPassword123\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Invalid login returns 401\", () => {\r

      \    pm.response.to.have.status(401);\r

      });\r

      \r

      pm.test(\"Invalid login returns the correct error\", () => {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.error).to.eql(\"Invalid email or password.\");\r

      });"
    language: text/javascript
order: 4000
