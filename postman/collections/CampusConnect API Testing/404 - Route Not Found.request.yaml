$kind: http-request
url: http://localhost:3000/api/v1/this-route-does-not-exist
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Unknown route returns 404\", () => {\r

      \    pm.response.to.have.status(404);\r

      });\r

      \r

      pm.test(\"Unknown route returns the correct error\", () => {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.error).to.eql(\"Route not found.\");\r

      });"
    language: text/javascript
order: 9000
