$kind: http-request
url: http://localhost:3000/api/v1/sessions
method: POST
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Missing credentials return 400\", () => {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Missing credentials return the correct error\", () => {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.error).to.eql(\r

      \        \"Email and password are required.\"\r

      \    );\r

      });"
    language: text/javascript
order: 5000
